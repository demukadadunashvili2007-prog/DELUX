<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELUX - Crypto Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .crypto-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .crypto-table th, .crypto-table td {
            padding: 15px;
            text-align: left;
        }
        .crypto-table th {
            background-color: #334155;
            color: #cbd5e1;
        }
        .crypto-table tr:not(:last-child) {
            border-bottom: 1px solid #334155;
        }
        .positive {
            color: #4ade80;
            font-weight: bold;
        }
        .negative {
            color: #f87171;
            font-weight: bold;
        }
        .logo-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-cell img {
            width: 24px;
            height: 24px;
        }
        .ad-banner {
            margin-top: 30px;
            background-color: #1e293b;
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            color: #64748b;
            border: 2px dashed #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>DELUX Crypto Tracker</h1>
            <p>კრიპტოვალუტების რეალური დროის მონიტორინგი</p>
        </header>

        <table class="crypto-table">
            <thead>
                <tr>
                    <th>აქტივი</th>
                    <th>ფასი (USD)</th>
                    <th>24სთ ცვლილება</th>
                </tr>
            </thead>
            <tbody id="crypto-data">
                <tr><td colspan="3" style="text-align: center;">იტვირთება...</td></tr>
            </tbody>
        </table>

        <!-- რეკლამის ადგილი (მომავალში აქ ჩასვამ Google AdSense-ის კოდს) -->
        <div class="ad-banner">
            რეკლამის ადგილი (Google AdSense)
        </div>
    </div>

    <script>
        async function fetchCryptoData() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1&sparkline=false');
                const data = await response.json();
                
                const tableBody = document.getElementById('crypto-data');
                tableBody.innerHTML = '';

                data.forEach(coin => {
                    const priceChange = coin.price_change_percentage_24h;
                    const changeClass = priceChange >= 0 ? 'positive' : 'negative';
                    const formattedChange = (priceChange >= 0 ? '+' : '') + priceChange.toFixed(2) + '%';

                    const row = `
                        <tr>
                            <td class="logo-cell">
                                <img src="${coin.image}" alt="${coin.name}">
                                <strong>${coin.name}</strong> (${coin.symbol.toUpperCase()})
                            </td>
                            <td>$${coin.current_price.toLocaleString()}</td>
                            <td class="${changeClass}">${formattedChange}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error('მონაცემების ჩატვირთვა ვერ მოხერხდა:', error);
                document.getElementById('crypto-data').innerHTML = `<tr><td colspan="3" style="text-align: center; color: #f87171;">მონაცემების ჩატვირთვა ვერ მოხერხდა. სცადეთ მოგვიანებით.</td></tr>`;
            }
        }

        fetchCryptoData();
        // განახლდება ყოველ 60 წამში
        setInterval(fetchCryptoData, 60000);
    </script>

</body>
</html>
